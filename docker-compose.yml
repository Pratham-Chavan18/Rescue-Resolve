services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swiggy
      POSTGRES_PASSWORD: swiggy
      POSTGRES_DB: swiggy_recovery
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiggy -d swiggy_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
